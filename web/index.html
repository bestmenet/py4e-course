<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Python for Everybody — offline course</title>
  <meta name="description" content="The complete PY4E course — book, lecture videos, slides and sample code — assembled into one offline site.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131518" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/theme.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/views.css">
  <script>
    /* Apply the saved theme before first paint so there is no flash. */
    try {
      var saved = localStorage.getItem('py4e:theme');
      if (saved) {
        saved = JSON.parse(saved);
        if (saved === 'dark' || saved === 'light') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      }
    } catch (e) { /* private mode: fall back to the system preference */ }
  </script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>

  <div id="boot" style="min-height:100vh;display:grid;place-items:center">
    <div style="text-align:center;max-width:32rem;padding:2rem">
      <div class="brand-mark" style="width:56px;height:56px;font-size:1.2rem;margin:0 auto 1.25rem">py</div>
      <h1 style="font-size:1.5rem;margin-bottom:0.5rem">Python for Everybody</h1>
      <p style="color:var(--ink-3);font-size:0.875rem;display:flex;align-items:center;justify-content:center;gap:0.6rem">
        <span class="spinner"></span> Loading the course…
      </p>
      <noscript>
        <p style="margin-top:1.5rem;color:var(--err);font-size:0.875rem">
          This course needs JavaScript. Every asset it uses is served locally — enable scripts and reload.
        </p>
      </noscript>
    </div>
  </div>

  <script type="module" src="/assets/js/app.js"></script>
</body>
</html>
